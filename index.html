<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">

  <!-- Inline SVG favicon -->

        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%2307162c'/%3E%3Cstop offset='100%25' stop-color='%231b4278'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Crect x='3' y='3' width='58' height='58' rx='11' fill='none' stroke='%23f59e0b' stroke-width='2' stroke-opacity='0.6'/%3E%3Ctext x='32' y='41' font-family='Plus Jakarta Sans,Arial,sans-serif' font-size='24' font-weight='800' fill='%23fbbf24' text-anchor='middle'%3EIR%3C/text%3E%3C/svg%3E">

  <!-- Apple touch icon -->
  <link rel="apple-touch-icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%2307162c'/%3E%3Crect x='8' y='8' width='164' height='164' rx='32' fill='none' stroke='%23f59e0b' stroke-width='4'/%3E%3Ctext x='90' y='116' font-family='Arial,sans-serif' font-size='70' font-weight='800' fill='%23fbbf24' text-anchor='middle'%3EIR%3C/text%3E%3C/svg%3E">

  <meta name="theme-color" content="#07162c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #07162c;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    .iframe-shell {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      background: #07162c;
      display: flex;
      flex-direction: column;
    }
    .fullscreen-iframe {
      display: block;
      width: 100%;
      height: 100%;
      flex: 1 1 auto;
      border: none;
      background: #f1f5f9;
      opacity: 0;
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .fullscreen-iframe.is-ready {
      opacity: 1;
    }
    /* Initial Boot Splash Loader */
    .boot-loader {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: radial-gradient(circle at 50% 35%, #163767 0%, #0b1f3a 55%, #061224 100%);
      color: #ffffff;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .boot-loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .boot-crest {
      position: relative;
      width: 76px;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .boot-crest-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid rgba(251, 191, 36, 0.18);
      border-top-color: #fbbf24;
      border-right-color: #38bdf8;
      animation: bootSpin 1.15s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
    }
    .boot-crest-ring-inner {
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-bottom-color: rgba(251, 191, 36, 0.75);
      animation: bootSpinReverse 1.6s linear infinite;
    }
    .boot-crest-badge {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
      color: #07162c;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 0.6px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
    }
    .boot-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.3px;
      color: #f8fafc;
      margin: 0;
      text-align: center;
    }
    .boot-sub {
      font-size: 12.5px;
      color: #94a3b8;
      margin: -10px 0 0;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .boot-bar {
      width: 180px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .boot-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, transparent, #fbbf24, #38bdf8, transparent);
      animation: bootSlide 1.3s ease-in-out infinite;
    }
    @keyframes bootSpin { to { transform: rotate(360deg); } }
    @keyframes bootSpinReverse { to { transform: rotate(-360deg); } }
    @keyframes bootSlide { 0% { transform: translateX(-120%); } 100% { transform: translateX(260%); } }
  </style>
</head>
<body>
  <div id="bootLoader" class="boot-loader" aria-live="polite">
    <div class="boot-crest">
      <div class="boot-crest-ring"></div>
      <div class="boot-crest-ring-inner"></div>
      <div class="boot-crest-badge">IR</div>
    </div>
    <h1 class="boot-title">Station Details Management</h1>
    <p class="boot-sub">Section: TI(M)/BDC &nbsp;•&nbsp; Eastern Railway</p>
    <div class="boot-bar"></div>
  </div>

  <div class="iframe-shell">
    <iframe
      id="appFrame"
      class="fullscreen-iframe"
      src="https://script.google.com/macros/s/AKfycbyMM281_1TyKaM-MvsILQhJuQFhhZ-j3OQIbhcNMuAR506-_cUOv3jqvTzfFT7cNrgbnw/exec"
      allow="fullscreen; clipboard-write"
      title="Station Details Management | TI(M)/BDC">
    </iframe>
  </div>

  <script>
    (function () {
      var BASE_EXEC_URL = "https://script.google.com/macros/s/AKfycbyMM281_1TyKaM-MvsILQhJuQFhhZ-j3OQIbhcNMuAR506-_cUOv3jqvTzfFT7cNrgbnw/exec";
      var TOKEN_KEY = "sd_token_v21";
      var frame = document.getElementById("appFrame");
      var bootLoader = document.getElementById("bootLoader");

      function hideBootLoader() {
        if (frame) frame.classList.add("is-ready");
        if (bootLoader) bootLoader.classList.add("hidden");
      }

      if (frame) {
        frame.addEventListener("load", function () {
          setTimeout(hideBootLoader, 180);
        });
        setTimeout(hideBootLoader, 4500);
      }

      try {
        var params = new URLSearchParams(window.location.search);
        var station = params.get("station");
        if (station && frame) {
          frame.src = BASE_EXEC_URL + "?station=" + encodeURIComponent(station.trim().toUpperCase());
        }
      } catch (e) {}

      function safeGetToken() {
        try { return sessionStorage.getItem(TOKEN_KEY) || localStorage.getItem(TOKEN_KEY) || ""; }
        catch (e) { return ""; }
      }
      function safeSetToken(token) {
        try {
          if (token) {
            sessionStorage.setItem(TOKEN_KEY, token);
            localStorage.setItem(TOKEN_KEY, token);
          } else {
            sessionStorage.removeItem(TOKEN_KEY);
            localStorage.removeItem(TOKEN_KEY);
          }
        } catch (e) {}
      }

      window.addEventListener("message", function (event) {
        var msg = event && event.data;
        if (!msg || typeof msg !== "object" || !msg.type) return;

        if (msg.type === "SDM_SET_TOKEN") {
          safeSetToken(String(msg.token || ""));
        } else if (msg.type === "SDM_CLEAR_TOKEN" || msg.type === "SDM_LOGOUT") {
          safeSetToken("");
          if (msg.reloadFrame && frame) {
            var sep = BASE_EXEC_URL.indexOf("?") === -1 ? "?" : "&";
            frame.src = BASE_EXEC_URL + sep + "_logout=" + Date.now();
          }
        } else if (msg.type === "SDM_GET_TOKEN") {
          var saved = safeGetToken();
          if (frame && frame.contentWindow) {
            frame.contentWindow.postMessage({ type: "SDM_TOKEN_RESPONSE", token: saved }, "*");
          }
        }
      });

      function syncViewportHeight() {
        if (!window.CSS || !CSS.supports || !CSS.supports("height", "100dvh")) {
          var vh = window.innerHeight;
          document.documentElement.style.height = vh + "px";
          document.body.style.height = vh + "px";
        }
      }
      window.addEventListener("resize", syncViewportHeight);
      window.addEventListener("orientationchange", syncViewportHeight);
      syncViewportHeight();
    })();
  </script>
</body>
</html>
